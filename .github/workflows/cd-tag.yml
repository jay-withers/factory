name: cd-tag

on:
  push:
    branches: [main]

jobs:
  # Bump the semver tag from the conventional commits since the last release
  # (and create a matching GitHub release) via the shared release template.
  tag:
    permissions:
      contents: write
    uses: jay-withers/workflows/.github/workflows/release.yml@c3cb744bf5ded408403142ab2ad28b5cdefe08c1 # v1.12.0
